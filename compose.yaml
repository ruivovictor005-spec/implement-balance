services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: implantacao
      POSTGRES_PASSWORD: implantacao
      POSTGRES_DB: implantacao
    ports:
      - "5432:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
      # Cria também o banco de testes na primeira inicialização.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U implantacao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados_pg:
